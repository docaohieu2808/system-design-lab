# Module 6: a primary (db) and one streaming replica (db2). The app writes to the primary and reads from the replica.
#   COMPOSE_FILE=compose.yaml:modules/m06-replication/compose.replica.yaml docker compose up -d --wait
services:
  db:
    volumes:
      - ./modules/m06-replication/primary-init.sh:/docker-entrypoint-initdb.d/02-replication.sh:ro

  db2:
    image: postgres:18.6-alpine
    user: postgres
    entrypoint: ["/replica-entrypoint.sh"]
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      APPLY_DELAY: ${APPLY_DELAY:-0}
    volumes:
      - ./modules/m06-replication/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "shortener"]
      interval: 2s
      retries: 60
    cpus: 0.5
    mem_limit: 1g

  app:
    environment:
      # writes: whichever of the two is the primary right now (after a failover, the promoted replica)
      DATABASE_URL: postgres://postgres:lab@db:5432,db2:5432/shortener?target_session_attrs=read-write&connect_timeout=1
      READ_DATABASE_URL: ${READ_DATABASE_URL-postgres://postgres:lab@db2:5432/shortener?connect_timeout=1}
      RYW_SECONDS: ${RYW_SECONDS:-0}
    depends_on:
      db2:
        condition: service_healthy
