# Optional dashboard overlay (`make dash`): Grafana + Prometheus + cStats next to the lab, and k6 sends its metrics
# to Prometheus. It costs CPU and disk, so measurements are taken with it OFF; it is for watching, not for numbers.
#   export COMPOSE_FILE=compose.yaml:compose.dash.yaml     (add your module's overlay after it)
# Grafana opens at http://localhost:3000 (anonymous, read-only, localhost only; no password exists in this repo).
services:
  prometheus:
    image: prom/prometheus:v3.16.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver",
              "--storage.tsdb.retention.time=1h", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./dash/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    cpus: 0.5
    mem_limit: 512m

  cstats:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    command: ["--docker_only=true", "--housekeeping_interval=2s", "--store_container_labels=false",
              "--whitelisted_container_labels=com.docker.compose.service", "--disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,resctrl,advtcp,memory_numa,cpu_topology"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true
    cpus: 0.5
    mem_limit: 256m

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/lab.json
    volumes:
      - ./dash/provisioning:/etc/grafana/provisioning:ro
      - ./dash/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    cpus: 0.5
    mem_limit: 512m

  k6:   # same service as in compose.yaml: only adds the output, so every runner sends its metrics when the overlay is on
    environment:
      K6_OUT: experimental-prometheus-rw
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: "p(50),p(95),p(99),max"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 2s
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "false"
