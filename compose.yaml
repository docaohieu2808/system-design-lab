# The lab: one app server, one database, and k6 to load them.
# CPU limits keep the numbers repeatable and leave the rest of the host alone:
# the system under test gets half a core each, k6 gets two so it is never the limit.
name: sdlab

services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: shortener
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # over TCP: while init.sql loads, Postgres runs a temporary server on the unix socket only, and a socket check
      # would report "ready" before the 100,000 links exist (the app then answered 503)
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "shortener"]
      interval: 2s
      retries: 30
    cpus: 0.5
    mem_limit: 1g

  app:
    build: ./app
    environment:
      DATABASE_URL: postgres://postgres:lab@db:5432/shortener
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      retries: 30
    cpus: 0.5
    mem_limit: 512m

  k6:
    image: grafana/k6:1.8.2
    profiles: ["load"]
    volumes:
      - ./:/lab
    working_dir: /lab
    user: "${UID:-1000}:${GID:-1000}"
    cpus: ${K6_CPUS:-2.0}   # the load generator must never be the bottleneck (lower it only to show what happens when it is)
    mem_limit: 1g
